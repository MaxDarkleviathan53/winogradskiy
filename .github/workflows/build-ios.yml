name: Build iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install Apple Certificate & Provisioning Profile
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          PP_UUID="d95a8369-4747-4848-bdd2-e9435ceb2500"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import distribution certificate
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Download and import Apple WWDR G3 certificate so trust chain works
          curl -s -f https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/wwdr.cer
          security import $RUNNER_TEMP/wwdr.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign || true

          # Allow codesign to access the key without prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add new keychain to search list while PRESERVING existing ones (system roots)
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          # Install provisioning profile — MUST be named <UUID>.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PP_UUID}.mobileprovision
          echo "Installed: ${PP_UUID}.mobileprovision"

      - name: Build & Export Signed App Store IPA
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          cd ios
          xcodebuild -project WinogradskyApp.xcodeproj \
            -scheme WinogradskyApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WinogradskyApp.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=97YA9Z6UW5 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="d95a8369-4747-4848-bdd2-e9435ceb2500" \
            PROVISIONING_PROFILE_SPECIFIER="d95a8369-4747-4848-bdd2-e9435ceb2500" \
            archive

          xcodebuild -exportArchive \
            -archivePath build/WinogradskyApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates

          cp build/ipa/*.ipa ../WinogradskyApp.ipa
          echo "=== IPA size ==="
          ls -lh ../WinogradskyApp.ipa
          # Verify embedded.mobileprovision is present
          unzip -p ../WinogradskyApp.ipa "Payload/*.app/embedded.mobileprovision" | head -c 50 && echo "✅ embedded.mobileprovision OK" || echo "❌ embedded.mobileprovision MISSING"

      - name: Upload to App Store Connect (TestFlight)
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.APP_STORE_API_KEY_BASE64 != ''
        continue-on-error: true
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          APP_STORE_API_KEY_BASE64: ${{ secrets.APP_STORE_API_KEY_BASE64 }}
          APP_STORE_API_ISSUER_ID: ${{ secrets.APP_STORE_API_ISSUER_ID }}
        run: |
          # Decode API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_Z896TY537L.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_Z896TY537L.p8

          echo "=== Validating IPA before upload ==="
          xcrun altool --validate-app \
            -f WinogradskyApp.ipa \
            -t ios \
            --apiKey Z896TY537L \
            --apiIssuer "$APP_STORE_API_ISSUER_ID" \
            --output-format xml 2>&1 || true

          echo "=== Uploading to App Store Connect ==="
          xcrun altool --upload-app \
            -f WinogradskyApp.ipa \
            -t ios \
            --apiKey Z896TY537L \
            --apiIssuer "$APP_STORE_API_ISSUER_ID" \
            --output-format xml 2>&1

          echo "✅ Upload to TestFlight completed!"

      - name: Fallback Ad-hoc Build (if no certificate secrets)
        if: env.BUILD_CERTIFICATE_BASE64 == ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          cd ios
          xcodebuild -project WinogradskyApp.xcodeproj \
            -scheme WinogradskyApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

          cd ..
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/WinogradskyApp.app Payload/
          zip -r WinogradskyApp.ipa Payload
          ls -lh WinogradskyApp.ipa

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinogradskyApp-iOS-Build
          path: WinogradskyApp.ipa
          if-no-files-found: warn
          retention-days: 14
